name: CI
on:
  push:
  pull_request:
jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: find . -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
